<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script src="https://unpkg.com/@tailwindcss/browser@4"></script>
    <title>Selection Sort Visualization</title>
    <link rel="stylesheet" href="selection_style.css" />
  </head>
  <body class="w-[100vw] h-[100vh] bg-gray-100">
    <main class="flex flex-col items-center justify-center h-full gap-4">
      <h1 class="text-3xl font-bold font-serif">
        Selection Sort Visualization
      </h1>
      <input
        id="arrayInput"
        type="text"
        placeholder="Enter 20 comma-separated numbers"
        class="w-180 h-14 border-[1px] border-blue-500/50 rounded-full px-5 bg-gray-300 shadow-md focus-within:outline-[1px] focus-within:outline-blue-500/50"
      />
      <div class="flex gap-4">
        <button
          onclick="startSorting()"
          class="button w-20 h-10 rounded-xl text-white cursor-pointer bg-blue-500 shadow-lg shadow-blue-500/50 font-serif"
        >
          Sort
        </button>
        <button
          id="pausePlayButton"
          onclick="togglePausePlay()"
          class="px-4 py-2 bg-green-500 text-white rounded-lg shadow"
        >
          Pause
        </button>
      </div>
      <div id="status" class="text-lg font-medium"></div>
      <div
        id="barContainer"
        class="w-[90%] h-[60%] flex items-center justify-center rounded-xl"
      ></div>
      <button id="togglePanelButton">Toggle Panel</button>
      <div id="slidingPanel"></div>
    </main>
    <script src="selection_script.js"></script>
  </body>
</html>
