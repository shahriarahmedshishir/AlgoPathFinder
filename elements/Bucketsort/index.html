<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="style.css" />
    <title>Bucket Sort Visualization</title>
  </head>
  <body>
    <h1>Bucket Sort Visualization</h1>
    <div class="input-container">
      <input
        class="custom-input"
        type="text"
        id="arrayInput"
        placeholder="Enter 20 numbers separated by commas"
      />
      <button onclick="startSorting()">Sort</button>
      <button id="pausePlayButton" onclick="togglePausePlay()">Pause</button>
    </div>
    <div id="status"></div>
    <div class="container" id="barContainer"></div>
    <div class="bucketContainer">
      <div class="bucket bucket-1">Bucket 1</div>
      <div class="bucket bucket-2">Bucket 2</div>
      <div class="bucket bucket-3">Bucket 3</div>
      <div class="bucket bucket-4">Bucket 4</div>
      <div class="bucket bucket-5">Bucket 5</div>
    </div>
    <div id="slidingPanel" class="sliding-panel">
      <button id="togglePanelButton" class="toggle-button">
        <svg
          class="arrow-icon"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
        >
          <polyline points="15 18 9 12 15 6"></polyline>
        </svg>
      </button>
      <div class="panel-content">
        <h2 class="panel-title">Sliding Panel Title</h2>
        <p class="panel-text">Your content goes here. Add anything you want!</p>
      </div>
    </div>

    <script src="script.js"></script>
  </body>
</html>
