<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script src="https://unpkg.com/@tailwindcss/browser@4"></script>
    <title>Quick Sort Visualization</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body class="w-[100vw] h-[100vh] bg-gray-100">
    <main class="flex flex-col items-center justify-center h-full gap-4">
      <h1 class="text-3xl font-bold font-serif">Quick Sort Visualization</h1>
      <input
        id="arrayInput"
        type="text"
        placeholder="Enter 20 comma-separated numbers"
        class="px-4 py-2 rounded-full border border-blue-400 bg-white w-[30rem]"
      />
      <div class="flex gap-4">
        <button
          onclick="startSorting()"
          class="px-4 py-2 bg-blue-500 text-white rounded-lg shadow"
        >
          Sort
        </button>
        <button
          id="pausePlayButton"
          onclick="togglePausePlay()"
          class="px-4 py-2 bg-green-500 text-white rounded-lg shadow"
        >
          Pause
        </button>
      </div>
      <div id="status" class="text-lg font-medium"></div>
      <div
        id="barContainer"
        class="w-[90%] h-[60%] flex items-center justify-center gap-2 mt-4"
      ></div>
    </main>
    <script src="script.js"></script>
  </body>
</html>
